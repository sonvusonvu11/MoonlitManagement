spring.application.name=HotelManagement

# CONFIG THYMELEAF
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# JDBC URL
# Database connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HoltelManagement;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#CONFIG HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CONFIG HIBERNATE NAMING STRATEGY
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT CONFIG
# 256-bit base64 secret. CHANGE THIS IN PRODUCTION!
app.jwt.secret=ZGV2LXNlY3JldC1rZXktbW9vbmxpdC1ob3RlbC1tYW5hZ2VtZW50LXNwcmluZy1ib290LWFuZ3VsYXItand0LTI1Ni1iaXRz
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000
app.jwt.cookie-name=JWT_TOKEN
app.jwt.refresh-cookie-name=JWT_REFRESH

# CORS
app.cors.allowed-origins=http://localhost:4200

# SPRINGDOC OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method