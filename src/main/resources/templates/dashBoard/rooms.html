<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Quản lý phòng')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container my-5">
    <a th:href="@{/dashboard}" class="btn btn-link"><i class="bi bi-arrow-left"></i> Dashboard</a>
    <h2 class="mb-4"><i class="bi bi-door-closed"></i> Tất cả phòng</h2>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Số phòng</th>
                    <th>Loại</th>
                    <th>Sức chứa</th>
                    <th>Giá/đêm</th>
                    <th>Trạng thái</th>
                    <th>Khách sạn</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rooms}">
                    <td>#<span th:text="${r.roomNumber}"></span></td>
                    <td th:text="${r.typeName}"></td>
                    <td th:text="${r.capacity}"></td>
                    <td>$<span th:text="${r.pricePerNight}"></span></td>
                    <td>
                        <span class="badge"
                              th:classappend="'badge-status-' + ${r.status}"
                              th:text="${r.status}"></span>
                    </td>
                    <td th:text="${r.hotelName}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
