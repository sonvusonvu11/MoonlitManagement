<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Quản lý khách')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container my-5">
    <a th:href="@{/dashboard}" class="btn btn-link"><i class="bi bi-arrow-left"></i> Dashboard</a>
    <h2 class="mb-4"><i class="bi bi-people-fill"></i> Danh sách khách hàng</h2>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Điện thoại</th>
                    <th>Địa chỉ</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="g : ${guests}">
                    <td th:text="${g.guestID}"></td>
                    <td th:text="${g.firstName + ' ' + g.lastName}"></td>
                    <td th:text="${g.email}"></td>
                    <td th:text="${g.phone}"></td>
                    <td th:text="${g.address}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(guests)}">
                    <td colspan="5" class="text-center text-muted">Chưa có khách hàng</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
