<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Quản lý đơn đặt')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container my-5">
    <a th:href="@{/dashboard}" class="btn btn-link"><i class="bi bi-arrow-left"></i> Dashboard</a>
    <h2 class="mb-4"><i class="bi bi-card-list"></i> Tất cả đơn đặt phòng</h2>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Khách</th>
                    <th>Phòng</th>
                    <th>Loại</th>
                    <th>Nhận</th>
                    <th>Trả</th>
                    <th>Đêm</th>
                    <th>Tổng tiền</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td th:text="${b.bookingID}"></td>
                    <td th:text="${b.guestName}"></td>
                    <td th:text="${b.roomNumber}"></td>
                    <td th:text="${b.roomTypeName}"></td>
                    <td th:text="${#temporals.format(b.checkinDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(b.checkoutDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${b.nights}"></td>
                    <td>$<span th:text="${b.totalPrice}"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="8" class="text-center text-muted">Chưa có đơn đặt</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
