<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Đăng ký')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container my-5" style="max-width: 560px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus text-primary" style="font-size: 3rem;"></i>
                <h3 class="mt-2">Đăng ký tài khoản</h3>
                <p class="text-muted">Tạo tài khoản để bắt đầu đặt phòng</p>
            </div>

            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                <ul class="mb-0">
                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                </ul>
            </div>

            <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
                <div class="mb-3">
                    <label class="form-label">Họ tên</label>
                    <input type="text" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tên đăng nhập</label>
                        <input type="text" th:field="*{username}" class="form-control"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{username}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control"/>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" th:field="*{password}" class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Xác nhận mật khẩu</label>
                        <input type="password" th:field="*{confirmPassword}" class="form-control"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-person-plus"></i> Đăng ký
                </button>
            </form>

            <hr/>
            <p class="text-center mb-0">
                Đã có tài khoản?
                <a th:href="@{/auth/login}" class="text-decoration-none">Đăng nhập</a>
            </p>
        </div>
    </div>
</div>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
