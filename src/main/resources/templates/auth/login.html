<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Đăng nhập')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container my-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-buildings text-primary" style="font-size: 3rem;"></i>
                <h3 class="mt-2">Đăng nhập</h3>
                <p class="text-muted">Đăng nhập để đặt phòng và quản lý đơn của bạn</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i>
                Tên đăng nhập hoặc mật khẩu không đúng.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                <i class="bi bi-check-circle"></i> Bạn đã đăng xuất thành công.
            </div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/auth/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập hoặc Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" required autofocus/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" required/>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
                </button>
            </form>

            <hr/>
            <p class="text-center mb-0">
                Chưa có tài khoản?
                <a th:href="@{/auth/register}" class="text-decoration-none">Đăng ký ngay</a>
            </p>
            <div class="alert alert-info mt-3 small mb-0">
                <b>Tài khoản admin demo:</b> <code>admin</code> / <code>admin123</code>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
