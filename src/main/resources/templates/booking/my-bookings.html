<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Đơn đặt phòng của tôi')}"></head>
<body>
<nav th:replace="~{layout/base :: navbar}"></nav>

<div class="container my-5">
    <h2 class="mb-4"><i class="bi bi-calendar-check"></i> Đơn đặt phòng của tôi</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info text-center">
        Bạn chưa có đơn đặt phòng nào.
        <a th:href="@{/rooms}" class="btn btn-primary btn-sm ms-2">Tìm phòng ngay</a>
    </div>

    <div class="card shadow-sm" th:if="${not #lists.isEmpty(bookings)}">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Mã đơn</th>
                    <th>Phòng</th>
                    <th>Loại phòng</th>
                    <th>Nhận phòng</th>
                    <th>Trả phòng</th>
                    <th>Số đêm</th>
                    <th>Tổng tiền</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td>#<span th:text="${b.bookingID}">1</span></td>
                    <td th:text="${b.roomNumber}">101</td>
                    <td th:text="${b.roomTypeName}">Standard</td>
                    <td th:text="${#temporals.format(b.checkinDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(b.checkoutDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${b.nights}"></td>
                    <td>
                        <b>$<span th:text="${b.totalPrice}">200</span></b>
                    </td>
                    <td>
                        <a th:href="@{/booking/cancel(bookingID=${b.bookingID})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('Bạn có chắc muốn huỷ đơn đặt phòng này?');">
                            <i class="bi bi-x-circle"></i> Huỷ
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
